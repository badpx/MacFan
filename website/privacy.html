<!doctype html>
<html lang="en" data-policy="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#faf9f5">
  <title>{{ en.Privacy.title }}</title>
  <meta name="description" content="{{ en.Privacy.description }}">
  <script>
    (function () {
      var allowed = {{ _lang_json }};
      var requested = new URLSearchParams(location.search).get("lang");
      var lang = allowed.indexOf(requested) === -1 ? "en" : requested;
      var root = document.documentElement;
      root.lang = lang;
      root.dataset.policy = lang;
      var titles = {{ _titles_json }};
      var descriptions = {{ _descriptions_json }};
      if (titles[lang]) document.title = titles[lang];
      var meta = document.querySelector('meta[name="description"]');
      if (meta && descriptions[lang]) meta.setAttribute("content", descriptions[lang]);
    })();
  </script>
  <link rel="canonical" href="{{ _canonical }}">
  {{ _alternates }}
  <link rel="icon" type="image/png" href="{{ _base }}/assets/favicon.png">
  <link rel="stylesheet" href="{{ _base }}/assets/style.css?v={{ _style_version }}">
  <script src="{{ _base }}/assets/site.js?v={{ _script_version }}" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">{{ _skip }}</a>
  <svg class="svg-defs" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs>
    <symbol id="globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="4" ry="9"/><path d="M3 12h18"/></symbol>
    <symbol id="github" viewBox="0 0 24 24"><path d="M9 20c-5 1-5-2-7-2m14 4v-4a3.5 3.5 0 0 0-1-2.5c3.3-.4 6.7-1.6 6.7-7.4A5.7 5.7 0 0 0 20.2 4a5.3 5.3 0 0 0-.1-4s-1.2-.4-4.1 1.5a14.3 14.3 0 0 0-7.4 0C5.7-.4 4.5 0 4.5 0a5.3 5.3 0 0 0-.1 4A5.7 5.7 0 0 0 3 8.1c0 5.8 3.4 7 6.7 7.4A3.5 3.5 0 0 0 8.7 18v4" transform="translate(2 3) scale(.8)"/></symbol>
  </defs></svg>

  <header class="site-header wrap">
    {{ _brands }}
    <nav class="main-nav" {{ _nav_labels }} aria-label="{{ en.Website.navigation }}">
      {{ _nav_features }}
      {{ _nav_how }}
      <a class="github-link" href="https://github.com/badpx/MacFan"><svg><use href="#github"/></svg><span>GitHub</span></a>
    </nav>
    <label class="language-picker"><svg aria-hidden="true"><use href="#globe"/></svg>{{ _language_labels }}<select id="language">{{ _languages }}</select></label>
  </header>

  <main id="main">
    {{ _articles }}
  </main>

  <footer class="site-footer wrap">
    {{ _footer_brands }}
    {{ _footer_blurbs }}
    <div>
      <a href="privacy.html" aria-current="page">{{ _privacy_labels }}</a>
      <a href="{{ _issues }}">{{ _feedback_labels }}</a>
      <a href="https://github.com/badpx/MacFan">GitHub</a>
    </div>
  </footer>
  <script>
    (function () {
      var lang = document.documentElement.dataset.policy || "en";
      var nav = document.querySelector(".main-nav");
      if (nav) {
        var label = nav.getAttribute("data-label-" + lang);
        if (label) nav.setAttribute("aria-label", label);
      }
      var current = document.querySelector('a[aria-current="page"]');
      if (current && lang !== "en") {
        current.setAttribute("href", "privacy.html?lang=" + encodeURIComponent(lang));
      }
    })();
  </script>
</body>
</html>
